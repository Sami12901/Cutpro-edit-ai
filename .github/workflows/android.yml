name: CutPro Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python for E2E Suite
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run Opaque-Box E2E Regression Suite (915 Tests)
        run: python tests/e2e/runner.py

      - name: Verify Zero-Emoji Invariant
        run: |
          python -c "
          import os, re
          emoji_pattern = re.compile(r'[\U0001F600-\U0001F64F\U0001F300-\U0001F5FF\U0001F680-\U0001F6FF\U0001F1E0-\U0001F1FF]')
          violations = []
          for root, _, files in os.walk('.'):
              if any(ignored in root for ignored in ['.git', '.gradle', 'build', '.idea', '.agents', '.vscode']):
                  continue
              for file in files:
                  if file.endswith(('.kt', '.kts', '.xml', '.md')):
                      path = os.path.join(root, file)
                      try:
                          with open(path, 'r', encoding='utf-8') as f:
                              for i, line in enumerate(f, 1):
                                  if emoji_pattern.search(line):
                                      violations.append(f'{path}:{i}: {line.strip()}')
                      except Exception:
                          pass
          if violations:
              print('Zero-emoji violations detected:')
              for v in violations:
                  print('  ' + v)
              exit(1)
          print('Zero-emoji invariant verified cleanly.')
          "

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
