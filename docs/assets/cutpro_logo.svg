<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Vibrant Cyan / Indigo Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Accent Violet Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>

  <!-- Subtle Studio Grid Elements -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.6"/>

  <!-- Glow Underlay -->
  <g filter="url(#neonGlow)" opacity="0.45">
    <path d="M168 136 L344 256 L168 376 Z" fill="url(#primaryGrad)"/>
    <path d="M192 136 L320 256 L208 360" stroke="#38BDF8" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Central Precision Cut & Play Symbol -->
  <!-- Left Wing / Film Blade -->
  <path d="M160 148 C160 138 172 132 180 138 L256 190 L212 256 L160 196 Z" fill="url(#primaryGrad)"/>
  
  <!-- Right Wing / Motion Blade -->
  <path d="M212 256 L352 248 C362 247 367 259 360 266 L276 348 C270 354 260 352 256 344 L232 296 Z" fill="url(#accentGrad)"/>

  <!-- Core Dynamic Cut Prism -->
  <polygon points="176,160 344,256 176,352 224,256" fill="url(#primaryGrad)"/>
  <polygon points="224,256 344,256 264,320" fill="url(#accentGrad)" opacity="0.85"/>

  <!-- Precision Cut Gap (The "Cut" Axis) -->
  <line x1="288" y1="140" x2="192" y2="372" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>

  <!-- Cyan Laser Edge -->
  <line x1="284" y1="148" x2="228" y2="284" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Motion Track Accent Dots -->
  <circle cx="344" cy="256" r="6" fill="#38BDF8"/>
  <circle cx="160" cy="148" r="4" fill="#818CF8"/>
  <circle cx="176" cy="352" r="4" fill="#06B6D4"/>
</svg>

